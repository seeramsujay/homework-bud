[project]
name = "homework-bud"
version = "0.1.0"
description = "Personalized handwriting synthesis for ruled notebook pages"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.22.0",
    "opencv-python-headless>=4.7.0",
    "pillow>=9.0.0",
    "reportlab>=3.6.0",
    "scipy>=1.8.0",
    "svgwrite>=1.4.0",
    "torch>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
