<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="hwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Container -->
  <rect width="160" height="160" rx="36" fill="#070c14" />
  <rect x="2" y="2" width="156" height="156" rx="34" fill="none" stroke="#0284c7" stroke-opacity="0.22" stroke-width="2" />

  <!-- Ruled Notebook Sheet Lines & Continuous Recurrent Handwriting Pen Stroke -->
  <g filter="url(#hwGlow)">
    <!-- Ruled Sheet Horizontal Blue Guidelines -->
    <line x1="32" y1="48" x2="128" y2="48" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="32" y1="74" x2="128" y2="74" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="32" y1="100" x2="128" y2="100" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="32" y1="126" x2="128" y2="126" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35" />

    <!-- Notebook Left Red Margin Rule -->
    <line x1="48" y1="36" x2="48" y2="134" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.6" />

    <!-- Graves RNN Continuous Cursive Handwriting Vector Stroke -->
    <path d="M54 74 C58 62 66 60 70 74 C74 88 82 88 86 74 C90 60 98 62 102 74 C106 86 114 84 120 70" fill="none" stroke="url(#hwGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stylus Fountain Pen Nib Inking the Baseline -->
    <polygon points="120,70 128,62 134,68 126,76" fill="#38bdf8" />
    <circle cx="120" cy="70" r="2.5" fill="#ffffff" />
  </g>
</svg>
