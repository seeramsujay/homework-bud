<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Homework-Bud - Handwriting Style Recorder</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; }
    p.subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 12px; text-align: center; max-width: 600px; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prompt-box {
      background: #0f172a;
      border-left: 4px solid #3b82f6;
      padding: 10px 14px;
      border-radius: 6px;
    }
    .prompt-label { font-size: 0.75rem; text-transform: uppercase; color: #60a5fa; letter-spacing: 0.5px; font-weight: 700; }
    .prompt-text { font-size: 1.05rem; font-weight: 500; color: #e2e8f0; margin-top: 4px; }
    #canvas-container {
      position: relative;
      width: 100%;
      height: 260px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #334155;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }
    button.btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    button.btn-secondary:hover { background: #475569; }
    button.btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    button.btn-primary:hover { background: #1d4ed8; }
    .stats {
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>Homework-Bud Style Recorder</h1>
  <p class="subtitle">Write the sentence below naturally with your finger or stylus. One clean sentence is all the model needs to clone your stroke curves, rhythm, and slant!</p>

  <div class="card">
    <div class="prompt-box">
      <div class="prompt-label">Target Text to Write:</div>
      <input type="text" id="target-input" value="thought that vengeance was sweet" 
             style="background: transparent; border: none; color: #38bdf8; font-size: 1.1rem; width: 100%; font-family: inherit; font-weight: 600; outline: none; margin-top: 4px;">
    </div>

    <div id="canvas-container">
      <canvas id="paintCanvas"></canvas>
    </div>

    <div class="stats">
      <span id="stroke-info">Strokes: 0 | Points: 0</span>
      <span>Color: Royal Blue</span>
    </div>

    <div class="button-group">
      <button class="btn-secondary" id="btnClear">Clear</button>
      <button class="btn-secondary" id="btnUndo">Undo Last Stroke</button>
      <button class="btn-primary" id="btnSave">Save Style for Model (.json)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const strokeInfo = document.getElementById('stroke-info');
    const targetInput = document.getElementById('target-input');

    let strokes = []; // Array of strokes, each is array of {x, y}
    let currentStroke = null;
    let isDrawing = false;

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      redraw();
    }

    window.addEventListener('resize', resizeCanvas);

    function redraw() {
      const rect = container.getBoundingClientRect();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, rect.width, rect.height);

      // Draw faint ruled baseline guideline
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      const baselineY = rect.height * 0.65;
      ctx.beginPath();
      ctx.moveTo(0, baselineY);
      ctx.lineTo(rect.width, baselineY);
      ctx.stroke();

      // Draw ink strokes
      ctx.strokeStyle = '#1e3a8a'; // Royal Blue
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let totalPoints = 0;
      for (const stroke of strokes) {
        if (stroke.length === 0) continue;
        totalPoints += stroke.length;
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          ctx.lineTo(stroke[i].x, stroke[i].y);
        }
        ctx.stroke();
      }

      strokeInfo.textContent = `Strokes: ${strokes.length} | Points: ${totalPoints}`;
    }

    function getCoords(e) {
      const rect = container.getBoundingClientRect();
      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startStroke(e) {
      e.preventDefault();
      isDrawing = true;
      const pt = getCoords(e);
      currentStroke = [pt];
      strokes.push(currentStroke);
      redraw();
    }

    function moveStroke(e) {
      if (!isDrawing || !currentStroke) return;
      e.preventDefault();
      const pt = getCoords(e);
      currentStroke.push(pt);
      redraw();
    }

    function endStroke(e) {
      if (!isDrawing) return;
      isDrawing = false;
      currentStroke = null;
      redraw();
    }

    canvas.addEventListener('mousedown', startStroke);
    window.addEventListener('mousemove', moveStroke);
    window.addEventListener('mouseup', endStroke);

    canvas.addEventListener('touchstart', startStroke, { passive: false });
    window.addEventListener('touchmove', moveStroke, { passive: false });
    window.addEventListener('touchend', endStroke);

    document.getElementById('btnClear').onclick = () => {
      strokes = [];
      redraw();
    };

    document.getElementById('btnUndo').onclick = () => {
      strokes.pop();
      redraw();
    };

    document.getElementById('btnSave').onclick = () => {
      if (strokes.length === 0) {
        alert("Please write the prompt sentence before exporting!");
        return;
      }

      // Convert to sequence of coordinates: [x, -y, eos]
      const rawCoords = [];
      for (let sIdx = 0; sIdx < strokes.length; sIdx++) {
        const stroke = strokes[sIdx];
        for (let pIdx = 0; pIdx < stroke.length; pIdx++) {
          const isEos = (pIdx === stroke.length - 1) ? 1.0 : 0.0;
          rawCoords.push([stroke[pIdx].x, -1 * stroke[pIdx].y, isEos]);
        }
      }

      const styleData = {
        text: targetInput.value.trim(),
        coords: rawCoords
      };

      const blob = new Blob([JSON.stringify(styleData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'user_style.json';
      a.click();
      URL.revokeObjectURL(url);
    };

    resizeCanvas();
  </script>
</body>
</html>
